<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Manager</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
        }

        form {
            width: 315px;
            display: flex;
            flex-direction: column;
        }

        input,
        button,
        span {
            font-size: 16px;
        }

        .container {
            display: flex;
            flex-direction: column;
            padding: 1em 0;
            justify-content: space-between;
        }

        .container:first-child {
            display: flex;
            flex-direction: row;
            padding: 1em 0;
        }

        /**    Custom input   **/

        .custom-input {
            border: none;
            border-bottom: 1px grey solid;
            padding-top: 5px;
            padding-bottom: 5px;
        }

        .custom-input:focus-visible {
            outline-offset: 1px;
        }

        /**    Switch with slider   **/

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #27ae60;
            -webkit-transition: .4s;
            transition: .4s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
        }

        input:checked+.slider {
            background-color: #c0392b;
        }

        input:focus+.slider {
            box-shadow: 0 0 1px #c0392b;
        }

        input:checked+.slider:before {
            -webkit-transform: translateX(26px);
            -ms-transform: translateX(26px);
            transform: translateX(26px);
        }

        .slider.round {
            border-radius: 34px;
        }

        .slider.round:before {
            border-radius: 50%;
        }

        /**    Send button   **/
        button {
            padding: 0.5em 1em;
            cursor: pointer;
            background-color: white;
            border-radius: 5px;
            font-weight: bold;
        }

        button:hover {
            background-color: #bdc3c7;
        }

        /**    Table   **/
        table {
            border: 1px solid black;
            border-radius: 5px;
            padding: 1em;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }

        th,
        td {
            padding: 0.5em;
        }

        img {
            aspect-ratio: 1/1;
            max-width: 20px;
            cursor: pointer;
        }

        #get-all-button {
            border-top: none;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }

        form,
        div,
        h1 {
            z-index: 1;
        }

        /* Box */

        .box {
            z-index: 0;
        }

        .box:before {
            position: fixed;
            content: '';
            width: calc(100% + 30px);
            height: calc(100% + 30px);

            /* transform: translate(-50%, -50%) scale(.7); */
            filter: blur(0);
            opacity: 1;
            transition: all 450ms cubic-bezier(0.23, 1, 0.32, 1);
        }

        .box:before {
            background-color: #f3e8ff;
            box-shadow: 2px 2px 12px 0 rgba(0, 0, 0, 0.58);
            border-radius: 21px;
            background-image:
                url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='1600' height='198'%3e%3cdefs%3e%3clinearGradient id='a' x1='50%25' x2='50%25' y1='-10.959%25' y2='100%25'%3e%3cstop stop-color='%23fcc900' stop-opacity='.25' offset='0%25'/%3e%3cstop stop-color='%23fcc900' offset='100%25'/%3e%3c/linearGradient%3e%3c/defs%3e%3cpath fill='url(%23a)' fill-rule='evenodd' d='M.005 121C311 121 409.898-.25 811 0c400 0 500 121 789 121v77H0s.005-48 .005-77z'/%3e%3c/svg%3e"),
                url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='1600' height='198'%3e%3cdefs%3e%3clinearGradient id='a' x1='50%25' x2='50%25' y1='-10.959%25' y2='100%25'%3e%3cstop stop-color='%23fcc900' stop-opacity='.25' offset='0%25'/%3e%3cstop stop-color='%23fcc900' offset='100%25'/%3e%3c/linearGradient%3e%3c/defs%3e%3cpath fill='url(%23a)' fill-rule='evenodd' d='M.005 121C311 121 409.898-.25 811 0c400 0 500 121 789 121v77H0s.005-48 .005-77z'/%3e%3c/svg%3e"),
                url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='1600' height='198'%3e%3cdefs%3e%3clinearGradient id='a' x1='50%25' x2='50%25' y1='-10.959%25' y2='100%25'%3e%3cstop stop-color='%23fcc900' stop-opacity='.25' offset='0%25'/%3e%3cstop stop-color='%23fcc900' offset='100%25'/%3e%3c/linearGradient%3e%3c/defs%3e%3cpath fill='url(%23a)' fill-rule='evenodd' d='M.005 121C311 121 409.898-.25 811 0c400 0 500 121 789 121v77H0s.005-48 .005-77z'/%3e%3c/svg%3e");
            background-repeat: repeat-x;
            background-size: 1600px 50%;
            background-position: 0 130%, -50px 130%, 500px 130%;

            animation: 20s waves linear infinite forwards;
        }

        @keyframes waves {
            to {
                background-position: 1600px 130%, 3150px 130%, 5300px 130%;
            }
        }
    </style>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script type="text/javascript">
        const conf = window.location.origin == "file:" || window.location.hostname == "127.0.0.1" ?
            "http://localhost:3000/budget-management/" :
            "https://my-endpoints.onrender.com/budget-management/";

        const map = new Map([
            [1, "Gennaio"],
            [2, "Febraio"],
            [3, "Marzo"],
            [4, "Aprile"],
            [5, "Maggio"],
            [6, "Giugno"],
            [7, "Luglio"],
            [8, "Agosto"],
            [9, "Settembre"],
            [10, "Ottobre"],
            [11, "Novembre"],
            [12, "Dicembre"],
        ]);

        async function send() {
            const object = {
                money: Number(document.getElementById("money").value),
                motivation: document.getElementById("motivation").value,
                date: new Date().getTime()
            };
            if (document.getElementById("expense").checked) {
                object.money = -object.money;
            }
            await fetch(conf, {
                body: JSON.stringify(object),
                method: "POST",
                headers: {
                    "Content-type": "application/json; charset=UTF-8"
                }
            });
            getLastTen();
        }
        let data;
        async function getLastTen() {
            data = await fetch(conf + "getLastTen", { method: "GET" })
                .then(async response => await response.json());
            document.getElementById("results").innerHTML = getTableTemplate(data);
        }

        function formatDate(milliseconds) {
            const date = new Date(milliseconds);
            return `${date.toLocaleDateString()}`;
        }

        function getTableTemplate(data) {
            const headers = ["Data", "Denaro", "Motivazione", "Azioni"];
            let template = "";

            template += "<thead><tr>";
            headers.forEach(header => {
                template += `
                        <th>
                            ${header}
                        </th>
                `;
            });
            template += "</tr></thead>";

            template += "<tbody>";
            let index = 0;
            data.forEach(element => {
                template += `
                    <tr>
                        <td>
                            <span>${formatDate(element.date)}</span>
                        </td>
                        <td>
                            <span>${element.money}</span>
                        </td>
                        <td>
                            <span>${element.motivation}</span>
                        </td>
                        <td>
                            <img src="./icons/edit.svg" alt="edit icon" onClick="edit(${index})">
                            <img src="./icons/delete.svg" alt="delete icon" onClick="cancel(${index})">
                        </td>
                    </tr>
                `;
                index++;
            });
            template += "</tbody>";

            return template;
        }

        async function getAllByMonth() {
            const data = await fetch(conf + "getAllByMonth", { method: "GET" })
                .then(response => response.json())
                .then(data => data);
            let html = "";

            for (const month of data) {
                html += `
                <p><strong>${map.get(month._id)}</strong>: <span>${month.income}</span> | <span style="color:red">${month.expenditure}</span> | <span style="color:green">${month.total > 0 ? month.total.toFixed(2) : ""}</span></p>
                `
            }
            document.getElementById("monthResults").innerHTML = html;
        }

        function edit(index) {
            console.log("edit", data[index]._id);
        }

        async function cancel(index) {
            console.log("cancel", data[index]._id);
            await fetch(conf + "delete/" + data[index]._id, {
                method: "DELETE",
                headers: {
                    "Content-type": "application/json; charset=UTF-8"
                }
            });
            getLastTen();
        }

        async function getAll() {
            const data = await fetch(conf + "getAll", { method: "GET" })
                .then(async response => await response.json());
            document.getElementById("results").innerHTML = getTableTemplate(data);
        }


        getLastTen();
    </script>
</head>

<body class="box">
    <h1>Budget Manager</h1>
    <form>        
        <div class="container">
            <label class="switch">
                <input type="checkbox" id="expense" checked="true">
                <span class="slider round"></span>
            </label>
            <input class="custom-input" type="number" id="money" placeholder="0.00">
        </div>

        <div class="container">
            <input class="custom-input" type="text" id="motivation" placeholder="Motivazione">
        </div>

        <div class="container">
            <button type="button" onclick="send()">Invia</button>
        </div>
    </form>

    
    <div class="container">
        <table id="results"></table>
        <button id="get-all-button" onclick="getAll()">Get all</button>
    </div>

    <div class="container">
        <div id="monthResults"></div>
        <button onclick="getAllByMonth()">Get All By Month</button>
    </div>
</body>

</html>
