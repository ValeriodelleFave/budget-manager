<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Manager</title>

    <!-- Meta tag e collegamenti per la PWA -->
    <meta name="theme-color" content="#27ae60">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
        }

        form {
            width: 315px;
            display: flex;
            flex-direction: column;
        }

        .container {
            display: flex;
            flex-direction: column;
            padding: 1em 0;
            justify-content: space-between;
        }

        .container:first-child {
            display: flex;
            flex-direction: row;
            padding: 1em 0;
        }

        /**    Banner Stato Connessione / Sync   **/
        #status-banner {
            display: none;
            padding: 0.5em 1em;
            border-radius: 5px;
            font-size: 0.9em;
            margin-bottom: 0.5em;
            text-align: center;
            width: 315px;
            box-sizing: border-box;
        }

        .status-offline {
            background-color: #f39c12;
            color: white;
        }

        .status-syncing {
            background-color: #2980b9;
            color: white;
        }

        /**    Custom input   **/
        .custom-input {
            border: none;
            border-bottom: 1px grey solid;
            padding-top: 5px;
            padding-bottom: 5px;
        }

        .custom-input:focus-visible {
            outline-offset: 1px;
        }

        /**    Switch with slider   **/
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #27ae60;
            -webkit-transition: .4s;
            transition: .4s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
        }

        input:checked+.slider {
            background-color: #c0392b;
        }

        input:focus+.slider {
            box-shadow: 0 0 1px #c0392b;
        }

        input:checked+.slider:before {
            -webkit-transform: translateX(26px);
            -ms-transform: translateX(26px);
            transform: translateX(26px);
        }

        .slider.round {
            border-radius: 34px;
        }

        .slider.round:before {
            border-radius: 50%;
        }

        /**    Send button   **/
        button {
            padding: 0.5em 1em;
            cursor: pointer;
            background-color: white;
            border-radius: 5px;
            font-weight: bold;
        }

        button:hover {
            background-color: #bdc3c7;
        }

        /**    Table   **/
        table {
            border: 1px solid black;
            border-radius: 5px;
            padding: 1em;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }

        th,
        td {
            padding: 0.5em;
        }

        .pending-row {
            opacity: 0.65;
            font-style: italic;
        }

        img {
            aspect-ratio: 1/1;
            max-width: 20px;
            cursor: pointer;
        }

        #get-all-button {
            border-top: none;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }

        /**    Dashboard   **/
        .dashboard-box {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 1em;
            width: 315px;
            box-sizing: border-box;
            background-color: #f9f9f9;
            text-align: center;
        }
        .dashboard-box p {
            margin: 0.5em 0;
            font-size: 1.1em;
        }

        form,
        div,
        h1 {
            z-index: 1;
        }
    </style>

    <script type="text/javascript">
        const conf = window.location.origin == "file:" || window.location.hostname == "127.0.0.1" || window.location.hostname == "localhost" ?
            "http://localhost:3000/budget-management/" :
            "https://my-endpoints.onrender.com/budget-management/";

        const map = new Map([
            [1, "Gennaio"], [2, "Febbraio"], [3, "Marzo"], [4, "Aprile"],
            [5, "Maggio"], [6, "Giugno"], [7, "Luglio"], [8, "Agosto"],
            [9, "Settembre"], [10, "Ottobre"], [11, "Novembre"], [12, "Dicembre"],
        ]);

        // --- Configurazione IndexedDB per la coda Offline ---
        const DB_NAME = "BudgetOfflineDB";
        const STORE_NAME = "pendingExpenses";

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = event => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "tempId", autoIncrement: true });
                    }
                };
                request.onsuccess = event => resolve(event.target.result);
                request.onerror = event => reject(event.target.error);
            });
        }

        async function saveOfflineExpense(expense) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).add(expense);
                tx.oncomplete = () => resolve();
                tx.onerror = event => reject(event.target.error);
            });
        }

        async function getOfflineExpenses() {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const request = tx.objectStore(STORE_NAME).getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = event => reject(event.target.error);
            });
        }

        async function deleteOfflineExpense(tempId) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).delete(tempId);
                tx.oncomplete = () => resolve();
                tx.onerror = event => reject(event.target.error);
            });
        }

        // --- Sincronizzazione automatica col Server ---
        async function syncOfflineExpenses() {
            const pending = await getOfflineExpenses();
            if (pending.length === 0) return;

            updateBanner("Sincronizzazione di " + pending.length + " voci in corso...", "status-syncing");

            for (const item of pending) {
                const { tempId, ...payload } = item;
                try {
                    const response = await fetch(conf, {
                        body: JSON.stringify(payload),
                        method: "POST",
                        headers: {
                            "Content-type": "application/json; charset=UTF-8"
                        }
                    });
                    if (response.ok) {
                        await deleteOfflineExpense(tempId);
                    }
                } catch (err) {
                    console.warn("Connessione ancora assente, riproverò più tardi.");
                    break;
                }
            }

            updateConnectionStatus();
            getLastTen();
        }

        function updateBanner(message, className) {
            const banner = document.getElementById("status-banner");
            if (!banner) return;
            if (!message) {
                banner.style.display = "none";
                banner.className = "";
            } else {
                banner.textContent = message;
                banner.className = className;
                banner.style.display = "block";
            }
        }

        function updateConnectionStatus() {
            if (!navigator.onLine) {
                updateBanner("Modalità Offline: le nuove spese verranno messe in coda.", "status-offline");
            } else {
                updateBanner("", "");
            }
        }

        // --- Funzioni Principali App ---
        async function send() {
            const moneyInput = document.getElementById("money");
            const motivationInput = document.getElementById("motivation");

            if (!moneyInput.value) return;

            const object = {
                money: Number(moneyInput.value),
                motivation: motivationInput.value,
                date: new Date().getTime()
            };
            if (document.getElementById("expense").checked) {
                object.money = -object.money;
            }

            try {
                if (!navigator.onLine) throw new Error("Offline");

                const response = await fetch(conf, {
                    body: JSON.stringify(object),
                    method: "POST",
                    headers: {
                        "Content-type": "application/json; charset=UTF-8"
                    }
                });

                if (!response.ok) throw new Error("Errore di rete");
            } catch (err) {
                await saveOfflineExpense(object);
                if ("serviceWorker" in navigator && "SyncManager" in window) {
                    const reg = await navigator.serviceWorker.ready;
                    try {
                        await reg.sync.register("sync-expenses");
                    } catch (syncErr) {
                        console.log("Background Sync non disponibile, userò l'evento online.");
                    }
                }
            }

            moneyInput.value = "";
            motivationInput.value = "";
            getLastTen();
        }

        let data = [];
        async function getLastTen() {
            try {
                data = await fetch(conf + "getLastTen", { method: "GET" })
                    .then(async response => await response.json());
            } catch (err) {
                data = [];
            }
            const pending = await getOfflineExpenses();
            document.getElementById("results").innerHTML = getTableTemplate(data, pending);
        }

        function formatDate(milliseconds) {
            const date = new Date(milliseconds);
            return `${date.toLocaleDateString()}`;
        }

        function getTableTemplate(serverData, pendingData = []) {
            const headers = ["Data", "Denaro", "Motivazione", "Azioni"];
            let template = "<thead><tr>";
            headers.forEach(header => {
                template += `<th>${header}</th>`;
            });
            template += "</tr></thead><tbody>";

            pendingData.forEach(element => {
                template += `
                    <tr class="pending-row">
                        <td><span>${formatDate(element.date)}</span></td>
                        <td><span>${element.money}</span></td>
                        <td><span>${element.motivation} (⏳ In coda)</span></td>
                        <td>
                            <span style="cursor:pointer;" title="Rimuovi dalla coda" onclick="cancelPending(${element.tempId})">❌</span>
                        </td>
                    </tr>
                `;
            });

            let index = 0;
            serverData.forEach(element => {
                template += `
                    <tr>
                        <td><span>${formatDate(element.date)}</span></td>
                        <td><span>${element.money}</span></td>
                        <td><span>${element.motivation}</span></td>
                        <td>
                            <img src="./icons/delete.svg" alt="delete icon" onClick="cancel(${index})">
                        </td>
                    </tr>
                `;
                index++;
            });
            template += "</tbody>";

            return template;
        }

        async function cancelPending(tempId) {
            await deleteOfflineExpense(tempId);
            getLastTen();
        }

        async function getAllByMonth() {
            const monthData = await fetch(conf + "getAllByMonth", { method: "GET" })
                .then(response => response.json());
            let html = `<p><strong>Mese</strong>: <span>Entrate</span> | <span style="color:red">Uscite</span> | <span style="color:green">Guadagno</span></p>`;

            for (const month of monthData) {
                html += `
                <p><strong>${map.get(month._id)}</strong>: <span>${month.income}</span> | <span style="color:red">${month.expenditure}</span> | <span style="color:green">${month.total > 0 ? month.total.toFixed(2) : ""}</span></p>
                `;
            }
            document.getElementById("monthResults").innerHTML = html;
        }

        async function cancel(index) {
            await fetch(conf + "delete/" + data[index]._id, {
                method: "DELETE",
                headers: {
                    "Content-type": "application/json; charset=UTF-8"
                }
            });
            getLastTen();
        }

        // --- Aggiornamento Dashboard Globale ---
        function updateDashboard(allData) {
            let entrate = 0;
            let uscite = 0;

            allData.forEach(item => {
                // Converto in Number per sicurezza nel calcolo
                const value = Number(item.money);
                if (value > 0) {
                    entrate += value;
                } else {
                    uscite += Math.abs(value);
                }
            });

            const saldo = entrate - uscite;

            const html = `
                <p><strong>Entrate:</strong> <span style="color: #27ae60;">${entrate.toFixed(2)} €</span></p>
                <p><strong>Uscite:</strong> <span style="color: #c0392b;">${uscite.toFixed(2)} €</span></p>
                <hr>
                <p><strong>Saldo Finale:</strong> <span style="color: ${saldo >= 0 ? '#27ae60' : '#c0392b'};">${saldo.toFixed(2)} €</span></p>
            `;

            document.getElementById("dashboard-content").innerHTML = html;
            document.getElementById("dashboard-container").style.display = "block";
        }

        async function getAll() {
            data = await fetch(conf + "getAll", { method: "GET" })
                .then(async response => await response.json());
            const pending = await getOfflineExpenses();
            document.getElementById("results").innerHTML = getTableTemplate(data, pending);
            
            // Popola e mostra la dashboard dopo aver ricevuto tutti i dati
            updateDashboard(data);
        }

        // Listener per stato rete e messaggi dal Service Worker
        window.addEventListener("load", () => {
            updateConnectionStatus();
            getLastTen();
            if (navigator.onLine) {
                syncOfflineExpenses();
            }
        });

        window.addEventListener("online", () => {
            updateConnectionStatus();
            syncOfflineExpenses();
        });

        window.addEventListener("offline", updateConnectionStatus);

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js")
                    .then(reg => console.log("Service Worker registrato:", reg.scope))
                    .catch(err => console.error("Errore Service Worker:", err));
            });

            navigator.serviceWorker.addEventListener("message", event => {
                if (event.data && event.data.type === "SYNC_COMPLETED") {
                    getLastTen();
                }
            });
        }
    </script>
</head>

<body>
    <h1>Budget Manager</h1>
    <div id="status-banner"></div>

    <form>        
        <div class="container">
            <label class="switch">
                <input type="checkbox" id="expense" checked="true">
                <span class="slider round"></span>
            </label>
            <input class="custom-input" type="number" id="money" placeholder="0.00">
        </div>

        <div class="container">
            <input class="custom-input" type="text" id="motivation" placeholder="Motivazione">
        </div>

        <div class="container">
            <button type="button" onclick="send()">Invia</button>
        </div>
    </form>

    <div class="container">
        <table id="results"></table>
        <button id="get-all-button" onclick="getAll()">Get all</button>
    </div>

    <div class="container">
        <div id="monthResults"></div>
        <button onclick="getAllByMonth()">Get All By Month</button>
    </div>

    <!-- Nuova Dashboard Totali -->
    <div class="container" id="dashboard-container" style="display: none;">
        <div class="dashboard-box">
            <h3>Riepilogo Totale</h3>
            <div id="dashboard-content"></div>
        </div>
    </div>

    <!-- Pulsante di installazione e diagnostica PWA per mobile -->
    <div class="container" style="align-items: center; margin-top: 1em;">
        <button id="install-button" style="display: none; background-color: #27ae60; color: white; border: none; padding: 0.8em 1.5em;">
            📲 Installa App
        </button>
        <small id="pwa-debug" style="color: grey; margin-top: 0.5em; text-align: center;"></small>
    </div>

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById("install-button");
        const debugText = document.getElementById("pwa-debug");

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js")
                .then(reg => {
                    debugText.textContent = "✅ Service Worker attivo (scope: " + reg.scope + ")";
                })
                .catch(err => {
                    debugText.textContent = "❌ Errore Service Worker: " + err.message;
                });
        }

        window.addEventListener("beforeinstallprompt", (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = "block";
            debugText.textContent = "✅ PWA pronta per l'installazione!";
        });

        installBtn.addEventListener("click", async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === "accepted") {
                installBtn.style.display = "none";
            }
            deferredPrompt = null;
        });
    </script>
</body>

</html>
